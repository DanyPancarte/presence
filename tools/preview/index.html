<!doctype html>
<html><head><meta charset="utf-8"><title>Présence — preview</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script src="renderer.js"></script>
<script>
// Usage: index.html?variant=routes&w=900&h=2000 then window.renderAt(t, overrides)
(async () => {
  const q = new URLSearchParams(location.search);
  const r = new SphereRenderer(document.getElementById('c'));
  await r.init();
  const buf = await (await fetch('data/' + (q.get('variant') || 'routes') + '.bin')).arrayBuffer();
  r.setGeometry(new Float32Array(buf));
  r.resize(+(q.get('w') || 900), +(q.get('h') || 2000));
  window.renderAt = (t, o) => { r.draw(t, Object.assign({}, DEFAULTS, o || {})); r.gl.finish(); return r.hdr; };
  window.ready = true;
})().catch(e => { window.error = String(e.stack || e); });
</script></body></html>
