<!doctype html>
<html><head><meta charset="utf-8"><title>Présence — preview</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script src="renderer.js"></script>
<script>
// index.html?w=900&h=2000 then window.run(seconds, preset, overrides) → simulates and renders.
(async () => {
  const q = new URLSearchParams(location.search);
  const r = new Organism(document.getElementById('c'), +(q.get('n') || 150000));
  await r.init();
  r.resize(+(q.get('w') || 900), +(q.get('h') || 2000));
  window.run = (seconds, preset, o) => {
    const p = Object.assign({}, DEFAULTS, o || {}, { preset: PRESETS[preset] });
    const steps = Math.round(seconds * 60);
    for (let i = 0; i < steps; i++) { r.step(1 / 60, p); if (i >= steps - 40) r.draw(1 / 60, p); }
    r.gl.finish();
    return r.hdr;
  };
  window.ready = true;
})().catch(e => { window.error = String(e.stack || e); });
</script></body></html>
