<style>

  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .hud { position: fixed; pointer-events: none; font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ash); }

  #say { left: 24px; right: 24px; bottom: calc(40px + env(safe-area-inset-bottom, 0px)); text-align: center; font-size: 11px; letter-spacing: 0.1em; text-transform: none; color: var(--bone); opacity: 0; transition: opacity 500ms; }
  #say.on { opacity: 0.8; }
  .ctl { position: fixed; right: 16px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 6px; }
  .ctl button { font: inherit; font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ash); background: transparent; border: 1px solid rgba(111,114,120,0.35); padding: 6px 10px; }
  .ctl button.on { color: var(--gold); border-color: var(--gold); }
  .ctl button:focus-visible { outline: 1px solid var(--bone); }
  #hint { left: 0; right: 0; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); text-align: center; transition: opacity 1s; }

<script>
'use strict';
// =============================================================================================
// PRÉSENCE — cinematic scene. A tilted disc of rings made of ten thousand ticks, ribbons that
// flow through it, and a topographic surface underneath whose contours rise with the voice.
// Gold on blue-black. Tilt-shift depth of field, bloom, grain, a warm leak. Pitch tilts the disc,
// loudness raises the terrain, bands breathe the rings, words spawn embers.
// =============================================================================================
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false });
const hdr = !!gl.getExtension('EXT_color_buffer_float');

// ---------------- shaders ----------------
const NOISE = `
vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;} vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);} vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){const vec2 C=vec2(1.0/6.0,1.0/3.0);const vec4 D=vec4(0.0,0.5,1.0,2.0);vec3 i=floor(v+dot(v,C.yyy));vec3 x0=v-i+dot(i,C.xxx);vec3 g=step(x0.yzx,x0.xyz);vec3 l=1.0-g;vec3 i1=min(g.xyz,l.zxy);vec3 i2=max(g.xyz,l.zxy);vec3 x1=x0-i1+C.xxx;vec3 x2=x0-i2+C.yyy;vec3 x3=x0-D.yyy;i=mod289(i);vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));float n_=0.142857142857;vec3 ns=n_*D.wyz-D.xzx;vec4 j=p-49.0*floor(p*ns.z*ns.z);vec4 x_=floor(j*ns.z);vec4 y_=floor(j-7.0*x_);vec4 x=x_*ns.x+ns.yyyy;vec4 y=y_*ns.x+ns.yyyy;vec4 h=1.0-abs(x)-abs(y);vec4 b0=vec4(x.xy,y.xy);vec4 b1=vec4(x.zw,y.zw);vec4 s0=floor(b0)*2.0+1.0;vec4 s1=floor(b1)*2.0+1.0;vec4 sh=-step(h,vec4(0.0));vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;vec3 p0=vec3(a0.xy,h.x);vec3 p1=vec3(a0.zw,h.y);vec3 p2=vec3(a1.xy,h.z);vec3 p3=vec3(a1.zw,h.w);vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0);m=m*m;return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));}
float fbm(vec3 p){ return snoise(p)*0.55 + snoise(p*2.1+3.7)*0.28 + snoise(p*4.3+9.1)*0.14; }
// the terrain: slow noise + voice bumps + ripples from the centre
float terrain(vec2 xz, float t, float amp, float shock, float low){
  float r = length(xz);
  float h = fbm(vec3(xz*0.9, t*0.06)) * 0.16;
  h += (amp * 0.22 + 0.05 * (0.5 + 0.5*sin(t*0.6))) * exp(-r*r*1.4) * (0.6 + 0.4*sin(t*9.0*amp + r*8.0));
  h += low * 0.10 * sin(r*6.0 - t*1.5) * exp(-r*0.9);
  h += shock * 0.08 * sin(r*18.0 - t*14.0) * exp(-r*1.2);
  return h;
}`;

const V_TERR = `#version 300 es
precision highp float; layout(location=0) in vec2 aXZ;
uniform mat4 uVP; uniform float uT, uAmp, uShock, uLow; out float vH; out vec3 vW; ${NOISE}
void main(){ float h = terrain(aXZ, uT, uAmp, uShock, uLow); vec3 w = vec3(aXZ.x, h - 0.42, aXZ.y); vW = w; vH = h; gl_Position = uVP * vec4(w, 1.0); }`;
const F_TERR = `#version 300 es
precision highp float; in float vH; in vec3 vW; uniform float uT, uAmp, uHeat; uniform vec3 uCam; out vec4 o;
void main(){
  float lv = vH * 26.0; float f = abs(fract(lv + 0.5) - 0.5) / max(fwidth(lv), 1e-4); float line = 1.0 - clamp(f - 0.25, 0.0, 1.0);
  float major = 1.0 - clamp(abs(fract(lv/4.0 + 0.5) - 0.5) / max(fwidth(lv/4.0), 1e-4) - 0.35, 0.0, 1.0);
  float r = length(vW.xz); float fade = exp(-r*r*0.55);
  float d = distance(vW, uCam); float fog = exp(-d*0.22);
  vec3 gold = vec3(1.0, 0.68, 0.30), ember = vec3(1.0, 0.36, 0.10);
  vec3 col = mix(gold, ember, clamp(vH*3.0 + uAmp*0.6, 0.0, 1.0));
  float I = (line * 0.6 + major * 1.0) * fade * fog * (0.55 + 0.7*uAmp + 0.3*uHeat);
  I += 0.012 * fade * fog; // surface veil
  o = vec4(col * I, 1.0); }`;

const V_PTS = `#version 300 es
precision highp float;
layout(location=0) in vec4 aA;  // angle, radius, y0, seed
layout(location=1) in vec4 aB;  // ring(0..5) or 9=ribbon, u, kind, phase
uniform mat4 uVP; uniform float uT, uAmp, uPitch, uHeat, uShock, uListen, uPx; uniform float uBands[8]; uniform vec3 uCam;
uniform vec4 uSeg[8]; uniform int uSegN; // tasks: start angle, length, progress, 97flag
out vec3 vC; out float vA; ${NOISE}
mat3 rotX(float a){ float c=cos(a), s=sin(a); return mat3(1,0,0, 0,c,s, 0,-s,c); }
mat3 rotZ(float a){ float c=cos(a), s=sin(a); return mat3(c,s,0, -s,c,0, 0,0,1); }
void main(){
  float ring = aB.x; float seed = aA.w; float kind = aB.z;
  vec3 p; vec3 col = vec3(0.95, 0.72, 0.38); float I = 1.0;
  if (ring < 8.5) {
    int ri = int(ring);
    float band = uBands[ri];
    float ang = aA.x + uT * (0.02 + 0.012*ring) * (1.0 + uListen*0.8);
    float rad = aA.y * (1.0 + band*0.10 + uShock*0.05*sin(aA.y*30.0 - uT*12.0));
    float y = aA.z + 0.02*snoise(vec3(cos(ang)*2.0, sin(ang)*2.0, uT*0.3 + ring)) + band*0.06*sin(ang*6.0 + uT*4.0);
    p = vec3(cos(ang)*rad, y, sin(ang)*rad);
    // the disc tilts with the pitch of the voice, and wobbles slowly
    p = rotX(0.12*sin(uT*0.21)) * rotZ(uPitch*0.35 + 0.08*sin(uT*0.17)) * p;
    // task segments on ring 2: brighter arcs; 97 % burns ember and has a hole
    if (ri == 2) {
      float a = mod(aA.x, 6.2831853); float inSeg = 0.0; float hot = 0.0; float hole = 0.0;
      for (int k = 0; k < 8; k++) { if (k >= uSegN) break; vec4 s = uSeg[k]; float rel = mod(a - s.x + 6.2831853, 6.2831853);
        if (rel < s.y) { if (rel < s.y * s.z) inSeg = 1.0; if (s.w > 0.5) { hot = 1.0; if (rel > s.y*s.z - 0.05 && rel < s.y*s.z + 0.03) hole = 1.0; } } }
      I *= 0.35 + 0.9*inSeg; col = mix(col, vec3(1.0, 0.42, 0.14), hot); I *= 1.0 - hole*0.95; I *= 1.0 + hot*0.6;
    }
    if (kind > 0.5) { I *= 1.8; col = mix(col, vec3(1.0,1.0,0.92), 0.5); }  // tick marks / labels dots
    I *= 0.55 + 0.45*sin(uT*(1.0+fract(seed*7.0)*4.0) + seed*50.0);
    I *= 1.0 + band*1.6;
  } else {
    // ribbons: spiralling streams that flow, breathing with the low band
    float k = aB.w; float u = fract(aB.y + uT * (0.03 + 0.02*fract(k*0.37)) * (1.0 + uAmp*2.0));
    float ang = u * 6.2831853 * 1.6 + k * 1.1 + uT*0.05;
    float rad = 0.25 + u * 1.15;
    float y = -0.1 + 0.35*u + 0.10*sin(u*14.0 + uT*1.3 + k) + uBands[0]*0.25*sin(u*20.0 - uT*6.0);
    p = vec3(cos(ang)*rad, y, sin(ang)*rad);
    p.xz += 0.03 * vec2(snoise(vec3(p.xz*3.0, uT*0.4+k)), snoise(vec3(p.zx*3.0, -uT*0.4+k)));
    col = mix(vec3(0.95, 0.75, 0.42), vec3(0.45, 0.85, 0.80), fract(k*0.618) * 0.6);
    I = (0.25 + 0.75*pow(sin(u*3.14159), 2.0)) * (0.5 + 0.5*sin(uT*3.0 + seed*40.0)) * (0.7 + uAmp);
  }
  // embers: recently captured words rise from the centre
  float d = distance(p, uCam);
  gl_Position = uVP * vec4(p, 1.0);
  float size = (1.4 + 1.4*fract(seed*3.3)) * uPx / max(d*0.5, 0.3);
  gl_PointSize = min(size * (1.0 + uHeat*0.5), 7.0*uPx);
  float fog = exp(-d*0.20);
  vC = col; vA = I * fog * 1.25;
}`;
const F_PTS = `#version 300 es
precision mediump float; in vec3 vC; in float vA; out vec4 o;
void main(){ vec2 d = gl_PointCoord - 0.5; float r = dot(d,d)*4.0; if (r > 1.0) discard; o = vec4(vC * exp(-r*2.5) * vA, 1.0); }`;

const V_FS = `#version 300 es
out vec2 v; void main(){ vec2 p = vec2(float((gl_VertexID<<1)&2), float(gl_VertexID&2)); v = p; gl_Position = vec4(p*2.0-1.0, 0.0, 1.0); }`;
const F_BLUR = `#version 300 es
precision mediump float; in vec2 v; uniform sampler2D u; uniform vec2 d; out vec4 o;
void main(){ float w[5] = float[](0.227,0.194,0.121,0.054,0.016); vec3 c = texture(u, v).rgb*w[0];
 for(int i=1;i<5;i++){ c += texture(u, v + d*float(i)).rgb*w[i]; c += texture(u, v - d*float(i)).rgb*w[i]; } o = vec4(c,1.0); }`;
const F_COMP = `#version 300 es
precision mediump float; in vec2 v; uniform sampler2D uS, uB, uD; uniform float uT, uAmp, uAlert, uListen, uFocus; uniform vec2 uRes; out vec4 o;
float hash(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*0.1031); p3 += dot(p3, p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
void main(){
  vec2 cc = v - 0.5; float r = length(cc * vec2(uRes.x/uRes.y, 1.0));
  vec2 ca = cc * r * 0.010;
  vec3 s; s.r = texture(uS, v+ca).r; s.g = texture(uS, v).g; s.b = texture(uS, v-ca).b;
  vec3 b = texture(uB, v).rgb; vec3 dfo = texture(uD, v).rgb;
  // tilt-shift: sharp band around the focus row, soft above and below
  float coc = smoothstep(0.04, 0.34, abs(v.y - uFocus));
  vec3 scene = mix(s, dfo, coc);
  vec3 bg = vec3(0.016, 0.022, 0.040);
  bg += vec3(0.16, 0.09, 0.03) * exp(-length((v - vec2(0.85, 1.05)) * vec2(1.0, 1.4)) * 2.2) * (0.7 + 0.5*uAmp);
  bg += vec3(0.02, 0.05, 0.10) * exp(-length(v - vec2(0.1, 0.0)) * 2.0);
  bg = mix(bg, vec3(0.12, 0.02, 0.0), uAlert * 0.7);
  bg += vec3(0.0, 0.06, 0.06) * uListen * exp(-r*2.0);
  vec3 c = bg + scene + b * 1.1;
  c *= 1.0 - smoothstep(0.4, 1.0, r) * 0.65;
  c = c / (1.0 + c * 0.55); c = pow(c, vec3(0.9));
  c += (hash(v*uRes + fract(uT*9.0)*100.0) - 0.5) * 0.04;
  o = vec4(c, 1.0); }`;

function mk(vs, fs) { const sh = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; };
  const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p); if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS); for (let i = 0; i < n; i++) { const inf = gl.getActiveUniform(p, i); u[inf.name.replace(/\[0\]$/, '')] = gl.getUniformLocation(p, inf.name); } return { p, u }; }
const pTerr = mk(V_TERR, F_TERR), pPts = mk(V_PTS, F_PTS), pBlur = mk(V_FS, F_BLUR), pComp = mk(V_FS, F_COMP);

// ---------------- geometry ----------------
// terrain grid (lines drawn as a triangle mesh; contours come from the fragment shader)
const G = 140, EXT = 2.4;
const tv = new Float32Array(G * G * 2); let k = 0;
for (let j = 0; j < G; j++) for (let i = 0; i < G; i++) { tv[k++] = (i / (G - 1) - 0.5) * 2 * EXT; tv[k++] = (j / (G - 1) - 0.5) * 2 * EXT; }
const ti = new Uint32Array((G - 1) * (G - 1) * 6); k = 0;
for (let j = 0; j < G - 1; j++) for (let i = 0; i < G - 1; i++) { const a = j * G + i; ti.set([a, a + 1, a + G, a + 1, a + G + 1, a + G], k); k += 6; }
const terrVao = gl.createVertexArray(); gl.bindVertexArray(terrVao);
const tb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, tb); gl.bufferData(gl.ARRAY_BUFFER, tv, gl.STATIC_DRAW); gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const tib = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, tib); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, ti, gl.STATIC_DRAW); gl.bindVertexArray(null);

// points: rings (6 rings of ticks) + ribbons
const RINGS = [0.30, 0.46, 0.64, 0.82, 1.0, 1.18];
const PER = [1400, 1800, 2600, 3000, 3600, 4000];
const RIB = 8, RIBN = 2600;
const NP = PER.reduce((a, b) => a + b) + RIB * RIBN;
const pa = new Float32Array(NP * 4), pb = new Float32Array(NP * 4); let n = 0;
RINGS.forEach((r, ri) => { for (let i = 0; i < PER[ri]; i++) { const a = Math.random() * Math.PI * 2; const rr = r + (Math.random() - 0.5) * 0.02 * (1 + ri * 0.4);
  pa.set([a, rr, (Math.random() - 0.5) * 0.015, Math.random()], n * 4); pb.set([ri, 0, Math.random() < 0.06 ? 1 : 0, 0], n * 4); n++; } });
for (let r = 0; r < RIB; r++) for (let i = 0; i < RIBN; i++) { pa.set([0, 0, 0, Math.random()], n * 4); pb.set([9, i / RIBN + (Math.random() - 0.5) * 0.002, 0, r], n * 4); n++; }
const ptVao = gl.createVertexArray(); gl.bindVertexArray(ptVao);
const ba = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, ba); gl.bufferData(gl.ARRAY_BUFFER, pa, gl.STATIC_DRAW); gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 4, gl.FLOAT, false, 0, 0);
const bb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, bb); gl.bufferData(gl.ARRAY_BUFFER, pb, gl.STATIC_DRAW); gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 4, gl.FLOAT, false, 0, 0);
gl.bindVertexArray(null);
const emptyVao = gl.createVertexArray();

// targets
let W, H, tS, tB1, tB2, tD1, tD2;
function target(w, h) { const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  if (hdr) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null); else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f); gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0); return { t, f, w, h }; }
function resize() { const dpr = Math.min(devicePixelRatio || 1, 2) * 0.72; W = canvas.width = Math.round(innerWidth * dpr); H = canvas.height = Math.round(innerHeight * dpr);
  tS = target(W, H); tB1 = target(W >> 2, H >> 2); tB2 = target(W >> 2, H >> 2); tD1 = target(W >> 1, H >> 1); tD2 = target(W >> 1, H >> 1); }
resize(); addEventListener('resize', resize);

// ---------------- camera ----------------
function perspective(f, a, n, fr) { const t = 1 / Math.tan(f / 2), nf = 1 / (n - fr); return [t / a, 0, 0, 0, 0, t, 0, 0, 0, 0, (fr + n) * nf, -1, 0, 0, 2 * fr * n * nf, 0]; }
function lookAt(e, c) { const zx = e[0] - c[0], zy = e[1] - c[1], zz = e[2] - c[2]; const zl = Math.hypot(zx, zy, zz); const z = [zx / zl, zy / zl, zz / zl];
  const x = [z[2], 0, -z[0]]; const xl = Math.hypot(...x); x[0] /= xl; x[2] /= xl; const y = [z[1] * x[2] - z[2] * x[1], z[2] * x[0] - z[0] * x[2], z[0] * x[1] - z[1] * x[0]];
  return [x[0], y[0], z[0], 0, x[1], y[1], z[1], 0, x[2], y[2], z[2], 0, -(x[0] * e[0] + x[1] * e[1] + x[2] * e[2]), -(y[0] * e[0] + y[1] * e[1] + y[2] * e[2]), -(z[0] * e[0] + z[1] * e[1] + z[2] * e[2]), 1]; }
function mul(a, b) { const o = new Array(16).fill(0); for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) for (let i = 0; i < 4; i++) o[c * 4 + r] += a[i * 4 + r] * b[c * 4 + i]; return o; }

// ---------------- state ----------------
const S = { amp: 0, ampT: 0, pitch: 0, pitchT: 0, bands: new Float32Array(8), heat: 0, heatT: 0, shock: 0, alert: 0, alertT: 0, listen: 0, listenT: 0, px: 0, py: 0 };
const ease = (a, b, k) => a + (b - a) * k;
const data = { tasks: [{ n: 'Site portfolio', p: 0.97, d: 11 }, { n: 'Beat tape 3', p: 0.92, d: 26 }, { n: 'Étagère', p: 0.6, d: 4 }, { n: 'Pitch', p: 0.35, d: 1 }, { n: 'Stream', p: 0.8, d: 40 }] };
function segments() { const n = data.tasks.length; const seg = Math.PI * 2 / n; const arr = new Float32Array(32); data.tasks.forEach((t, i) => { arr.set([i * seg + 0.06, seg - 0.12, t.p, t.p >= 0.9 && t.p < 1 ? 1 : 0], i * 4); }); return arr; }

// ---------------- sound + voice ----------------
let AC = null, sndOn = false, bed = null;
const audio = () => AC || (AC = new (window.AudioContext || window.webkitAudioContext)());
function tone(f, dur, type = 'sine', vol = 0.1, slide = 0) { if (!sndOn) return; const ac = audio(); const o = ac.createOscillator(); const g = ac.createGain(); o.type = type; o.frequency.setValueAtTime(f, ac.currentTime); if (slide) o.frequency.exponentialRampToValueAtTime(slide, ac.currentTime + dur);
  g.gain.setValueAtTime(0.0001, ac.currentTime); g.gain.exponentialRampToValueAtTime(vol, ac.currentTime + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur); o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + dur + 0.05); }
const VOW = [[730, 1090], [270, 2290], [530, 1840], [570, 840], [300, 870], [440, 1020]];
function syl(ac, t0, f0, dur, vw, vol, rough) { const src = ac.createOscillator(); src.type = 'sawtooth'; src.frequency.setValueAtTime(f0, t0); src.frequency.linearRampToValueAtTime(f0 * (1 + (Math.random() - 0.5) * 0.06), t0 + dur);
  const sub = ac.createOscillator(); sub.type = 'sine'; sub.frequency.setValueAtTime(f0 / 2, t0); const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.03); g.gain.setValueAtTime(vol, t0 + dur * 0.6); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  const f1 = ac.createBiquadFilter(); f1.type = 'bandpass'; f1.frequency.value = vw[0]; f1.Q.value = 6; const f2 = ac.createBiquadFilter(); f2.type = 'bandpass'; f2.frequency.value = vw[1]; f2.Q.value = 9; const mix = ac.createGain();
  src.connect(f1); src.connect(f2); f1.connect(mix); f2.connect(mix); sub.connect(mix); mix.connect(g); g.connect(ac.destination);
  if (rough) { const l = ac.createOscillator(); l.frequency.value = 28; const lg = ac.createGain(); lg.gain.value = f0 * 0.12; l.connect(lg); lg.connect(src.frequency); l.start(t0); l.stop(t0 + dur); }
  src.start(t0); sub.start(t0); src.stop(t0 + dur + 0.02); sub.stop(t0 + dur + 0.02); }
function speak(kind) { if (!sndOn) return; const ac = audio(); let t = ac.currentTime + 0.02; const base = 200 + Math.random() * 30;
  const P = { confirm: [3, i => 1.25 - i * 0.14, 0.16, 0.09, false], question: [4, i => 0.95 + i * 0.13, 0.15, 0.09, false], alert: [5, i => 0.55 + (i % 2) * 0.08, 0.14, 0.12, true], think: [6, i => 0.85 + 0.05 * Math.sin(i), 0.09, 0.05, false], hello: [2, i => 1.0 + i * 0.35, 0.2, 0.09, false] }[kind];
  for (let i = 0; i < P[0]; i++) { const dur = P[2] * (0.8 + Math.random() * 0.5); syl(ac, t, base * P[1](i), dur, VOW[Math.floor(Math.random() * 6)], P[3], P[4]); t += dur + 0.03; } }
const SFX = { word: () => tone(1200 + Math.random() * 600, 0.05, 'sine', 0.05), listen: () => tone(330, 0.5, 'sine', 0.08, 660), scan: () => tone(220, 1.2, 'sawtooth', 0.03, 880), done: () => { tone(523, 0.18, 'triangle', 0.1); setTimeout(() => tone(784, 0.3, 'triangle', 0.1), 90); }, alert: () => { tone(80, 0.6, 'sawtooth', 0.14, 40); setTimeout(() => tone(80, 0.6, 'sawtooth', 0.12, 40), 400); } };
document.getElementById('bS').addEventListener('click', e => { sndOn = !sndOn; e.currentTarget.classList.toggle('on', sndOn); if (sndOn && !bed) { const ac = audio(); const g = ac.createGain(); g.gain.value = 0; g.connect(ac.destination); const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = 48; o.connect(g); o.start(); g.gain.linearRampToValueAtTime(0.045, ac.currentTime + 2); bed = g; } else if (bed) { bed.gain.linearRampToValueAtTime(sndOn ? 0.045 : 0, audio().currentTime + 0.5); } });

// synthetic voice (the phone uses the real mic): amplitude, pitch, bands
let simV = false, vNext = 0, vLvl = 0, vPitch = 0, vPitchT = 0;
document.getElementById('bV').addEventListener('click', e => { simV = !simV; e.currentTarget.classList.toggle('on', simV); });
function voice(t) { if (simV && t > vNext) { const pause = Math.random() < 0.18; vLvl = pause ? 0 : 0.35 + Math.random() * 0.65; vPitchT = (Math.random() - 0.5) * 1.6; vNext = t + (pause ? 0.4 + Math.random() * 0.8 : 0.1 + Math.random() * 0.25); if (!pause && Math.random() < 0.4) S.shock = 1; }
  if (!simV) vLvl = 0; S.ampT = Math.max(S.ampT, vLvl); if (!simV && !running) S.ampT = 0;
  S.pitchT = simV ? vPitchT : 0;
  for (let i = 0; i < 8; i++) { const tg = S.amp * (0.3 + 0.7 * Math.abs(Math.sin(t * (1.5 + i * 0.7) + i))) * (1 - i / 12); S.bands[i] = ease(S.bands[i], tg, tg > S.bands[i] ? 0.5 : 0.08); } }

// ---------------- scenarios ----------------
const wait = ms => new Promise(r => setTimeout(r, ms));
const say = t => { const e = document.getElementById('say'); e.textContent = t; e.classList.toggle('on', !!t); };
const st = (a, b) => { document.getElementById('stSub').textContent = b || a.toLowerCase(); };
const caps = document.getElementById('caps');
function capture(w) { const d = document.createElement('div'); d.innerHTML = '<i></i>' + w; caps.appendChild(d); requestAnimationFrame(() => d.classList.add('on')); S.heatT = 1; setTimeout(() => S.heatT = 0, 400); SFX.word(); }
function clearCaps() { caps.innerHTML = ''; }
async function listen(words) { st('ÉCOUTE', 'écoute · voix'); S.listenT = 1; SFX.listen(); speak('hello'); clearCaps(); const was = simV; simV = true;
  for (const w of words) { if (w.k) capture(w.k + ' · ' + w.t); await wait(280 + Math.random() * 260); } simV = was; await wait(400); S.listenT = 0; }
async function analyse() { st('ANALYSE', 'analyse · contexte'); SFX.scan(); speak('think'); S.heatT = 0.6; await wait(1300); S.heatT = 0; clearCaps(); }
async function execute(line, alert, fn) { st('EXÉCUTION', 'exécute'); if (fn) fn(); S.heatT = 1; S.shock = 1; if (alert) { S.alertT = 1; SFX.alert(); setTimeout(() => speak('alert'), 300); } else { SFX.done(); setTimeout(() => speak(line.includes('?') ? 'question' : 'confirm'), 300); }
  say(line); await wait(2600); S.heatT = 0; S.alertT = 0; st('VEILLE', 'veille'); await wait(1800); say(''); }
const SCEN = [
  async () => { await listen([{ t: 'note' }, { t: 'le site portfolio', k: 'tâche' }, { t: 'est rendu à' }, { t: '97', k: 'tâche' }, { t: 'reste le formulaire' }]); await analyse(); await execute('Encore un 97. Le formulaire, c\'est vingt minutes.', false, () => { data.tasks[0].p = 0.97; }); },
  async () => { await listen([{ t: 'les Jordan 4' }, { t: 'à 260', k: 'budget' }, { t: 'je les prends ?' }]); await analyse(); await execute('Deux semaines. Si le 10 tu y penses encore, on en reparle.', true); },
  async () => { await listen([{ t: 'oui je l\'ai' }, { t: 'pris', k: 'méd' }, { t: 'à 8 h 12' }]); await analyse(); await execute('Noté. 8 h 12.', false); },
  async () => { await listen([{ t: 'idée', k: 'note' }, { t: 'sample de Nas' }, { t: 'sur le track 4' }]); await analyse(); await execute('Gardé. Continue.', false); },
];
let running = false, si = 0;
async function next() { if (running) return; running = true; document.getElementById('hint').style.opacity = 0; try { await SCEN[si++ % SCEN.length](); } finally { running = false; } }
document.getElementById('bN').addEventListener('click', next);
let sx = 0, sy = 0; addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; });
addEventListener('pointerup', e => { if (e.target.tagName === 'BUTTON') return; if (Math.hypot(e.clientX - sx, e.clientY - sy) < 12) next(); });
let ptx = 0, pty = 0; addEventListener('pointermove', e => { ptx = (e.clientX / innerWidth - 0.5) * 2; pty = (e.clientY / innerHeight - 0.5) * 2; });
addEventListener('deviceorientation', e => { if (e.gamma == null) return; ptx = Math.max(-1, Math.min(1, e.gamma / 30)); pty = Math.max(-1, Math.min(1, (e.beta - 45) / 30)); });

// ---------------- frame ----------------
const t0 = performance.now(); let last = t0;
function frame(now) {
  const t = (now - t0) / 1000, dt = Math.min((now - last) / 1000, 0.05); last = now;
  voice(t);
  S.amp = ease(S.amp, S.ampT, S.ampT > S.amp ? 0.35 : 0.05); S.pitch = ease(S.pitch, S.pitchT, 0.06); S.heat = ease(S.heat, S.heatT, 0.08); S.alert = ease(S.alert, S.alertT, 0.08); S.listen = ease(S.listen, S.listenT, 0.05);
  S.shock *= Math.exp(-dt * 2.2); S.px = ease(S.px, ptx, 0.03); S.py = ease(S.py, pty, 0.03);
  const A = W / H;
  // camera: slow orbit, pushes in with the voice, parallax with the hand
  const orb = t * 0.05 + S.px * 0.25; const dist = 2.9 - S.amp * 0.25 - S.listen * 0.15; const el = 1.35 + S.py * 0.2 + S.pitch * 0.1;
  const eye = [Math.sin(orb) * dist, el, Math.cos(orb) * dist]; const VP = mul(perspective(0.72, A, 0.1, 30), lookAt(eye, [0, -0.12, 0]));
  const px = H / 900;

  gl.bindFramebuffer(gl.FRAMEBUFFER, tS.f); gl.viewport(0, 0, W, H); gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE); gl.disable(gl.DEPTH_TEST);
  // terrain
  gl.useProgram(pTerr.p); gl.uniformMatrix4fv(pTerr.u.uVP, false, VP); gl.uniform1f(pTerr.u.uT, t); gl.uniform1f(pTerr.u.uAmp, S.amp); gl.uniform1f(pTerr.u.uShock, S.shock); gl.uniform1f(pTerr.u.uLow, S.bands[0]); gl.uniform1f(pTerr.u.uHeat, S.heat); gl.uniform3fv(pTerr.u.uCam, eye);
  gl.bindVertexArray(terrVao); gl.drawElements(gl.TRIANGLES, ti.length, gl.UNSIGNED_INT, 0);
  // rings + ribbons
  gl.useProgram(pPts.p); gl.uniformMatrix4fv(pPts.u.uVP, false, VP); gl.uniform1f(pPts.u.uT, t); gl.uniform1f(pPts.u.uAmp, S.amp); gl.uniform1f(pPts.u.uPitch, S.pitch); gl.uniform1f(pPts.u.uHeat, S.heat); gl.uniform1f(pPts.u.uShock, S.shock); gl.uniform1f(pPts.u.uListen, S.listen); gl.uniform1f(pPts.u.uPx, px);
  gl.uniform1fv(pPts.u.uBands, S.bands); gl.uniform3fv(pPts.u.uCam, eye); gl.uniform4fv(pPts.u.uSeg, segments()); gl.uniform1i(pPts.u.uSegN, data.tasks.length);
  gl.bindVertexArray(ptVao); gl.drawArrays(gl.POINTS, 0, NP); gl.bindVertexArray(emptyVao);
  gl.disable(gl.BLEND);
  // bloom + out-of-focus copies
  const blur = (src, a, b, rad) => { gl.useProgram(pBlur.p); gl.uniform1i(pBlur.u.u, 0); gl.activeTexture(gl.TEXTURE0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, a.f); gl.viewport(0, 0, a.w, a.h); gl.bindTexture(gl.TEXTURE_2D, src.t); gl.uniform2f(pBlur.u.d, rad / a.w, 0); gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.bindFramebuffer(gl.FRAMEBUFFER, b.f); gl.bindTexture(gl.TEXTURE_2D, a.t); gl.uniform2f(pBlur.u.d, 0, rad / a.h); gl.drawArrays(gl.TRIANGLES, 0, 3); };
  blur(tS, tB1, tB2, 1.8); blur(tS, tD1, tD2, 1.4);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H); gl.useProgram(pComp.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tS.t); gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, tB2.t); gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, tD2.t);
  gl.uniform1i(pComp.u.uS, 0); gl.uniform1i(pComp.u.uB, 1); gl.uniform1i(pComp.u.uD, 2); gl.uniform1f(pComp.u.uT, t); gl.uniform1f(pComp.u.uAmp, S.amp); gl.uniform1f(pComp.u.uAlert, S.alert); gl.uniform1f(pComp.u.uListen, S.listen); gl.uniform1f(pComp.u.uFocus, 0.5); gl.uniform2f(pComp.u.uRes, W, H);
  gl.drawArrays(gl.TRIANGLES, 0, 3); gl.activeTexture(gl.TEXTURE0);
  const nw = new Date(); document.getElementById('ckB').textContent = nw.toTimeString().slice(0, 5); document.getElementById('ckS').textContent = ['dim', 'lun', 'mar', 'mer', 'jeu', 'ven', 'sam'][nw.getDay()] + ' · sem ' + Math.ceil(((nw - new Date(nw.getFullYear(), 0, 1)) / 864e5 + 1) / 7);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
